<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>House</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; overflow: hidden; font-family: system-ui, sans-serif; }
    canvas { display: block; cursor: grab; }
    canvas.dragging { cursor: grabbing; }

    /* ── FAB ── */
    #menu-btn {
      position: fixed;
      bottom: 28px;
      right: 24px;
      z-index: 30;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.45);
      transition: background 0.2s, transform 0.25s;
    }
    #menu-btn:hover { background: rgba(255,255,255,0.2); }
    #menu-btn.open  { transform: rotate(45deg); background: rgba(255,255,255,0.18); }

    /* ── Full-screen overlay ── */
    #overlay {
      position: fixed;
      inset: 0;
      z-index: 25;
      background: rgba(6, 6, 20, 0.82);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    #overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    #overlay-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-bottom: 20px;
    }

    #view-list {
      list-style: none;
      width: min(360px, 88vw);
      max-height: 75vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    #view-list::-webkit-scrollbar { display: none; }

    #view-list li {
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    #view-list li:last-child { border-bottom: none; }

    #view-list li a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 4px;
      color: rgba(255,255,255,0.75);
      text-decoration: none;
      font-size: 15px;
      font-weight: 400;
      cursor: pointer;
      transition: color 0.15s, padding-left 0.15s;
    }
    #view-list li a::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      flex-shrink: 0;
      transition: background 0.15s;
    }
    #view-list li a:hover,
    #view-list li a:hover::before { color: #fff; background: #6c8fff; padding-left: 4px; }
    #view-list li.active a       { color: #fff; font-weight: 500; }
    #view-list li.active a::before { background: #6c8fff; }

    #room-name {
      position: fixed;
      top: 20px;
      left: 24px;
      z-index: 30;
      color: rgba(255,255,255,0.85);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.04em;
      pointer-events: none;
      text-shadow: 0 1px 8px rgba(0,0,0,0.6);
    }

    #coords { display: none !important; }

    /* ── D-pad ── */
    #dpad {
      display: none;
      position: fixed;
      bottom: 28px;
      left: 24px;
      z-index: 20;
      width: 120px;
      height: 120px;
      user-select: none;
      -webkit-user-select: none;
    }
    #dpad.visible { display: grid; }
    #dpad {
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 4px;
    }
    .dp {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.7);
      font-size: 16px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: background 0.1s;
      touch-action: none;
    }
    .dp:empty { background: transparent; border-color: transparent; pointer-events: none; }
    .dp.pressed { background: rgba(108,143,255,0.45); border-color: rgba(108,143,255,0.6); }

    /* ── Room nav arrows ── */
    #room-nav {
      position: fixed;
      bottom: 90px;
      right: 24px;
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .room-nav-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.45);
      transition: background 0.2s;
      user-select: none;
      -webkit-user-select: none;
    }
    .room-nav-btn:hover { background: rgba(255,255,255,0.2); }
    .room-nav-btn:active { background: rgba(108,143,255,0.45); }
  </style>
</head>
<body>

<div id="room-name">Global View</div>
<div id="overlay">
  <p id="overlay-title">Vyberte pohled</p>
  <ul id="view-list"></ul>
</div>
<div id="dpad">
  <div class="dp"></div>
  <div class="dp" data-key="w">▲</div>
  <div class="dp"></div>
  <div class="dp" data-key="a">◀</div>
  <div class="dp" data-key="s">▼</div>
  <div class="dp" data-key="d">▶</div>
  <div class="dp"></div>
  <div class="dp"></div>
  <div class="dp"></div>
</div>
<div id="room-nav">
  <button class="room-nav-btn" id="room-prev">&#9650;</button>
  <button class="room-nav-btn" id="room-next">&#9660;</button>
</div>
<button id="menu-btn">&#9776;</button>
<div id="coords"><div id="coords-text"></div><button id="coords-copy">Copy to clipboard</button></div>

<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
</script>
<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  // ─── VIEWS ──────────────────────────────────────────────────────────────────
  // Add/rename/reorder freely — buttons are generated from this object.
  // autoRotate: true = global orbit view, false = FPS room view
  const VIEWS = {
    global: {
      name: 'Global View',
      position: new THREE.Vector3(10, 5, 10),
      target:   new THREE.Vector3(0, 0, 0),
      autoRotate: true,
    },
    room7: {

      position: new THREE.Vector3(-1.863, -1.691, 8.136),
      target:   new THREE.Vector3(-2.128, -1.987, 7.218),
      autoRotate: false,
    },
    room8: {
      name: 'Bara Predsin',
      position: new THREE.Vector3(-2.795, -1.735, 6.167),
      target:   new THREE.Vector3(-2.545, -2.042, 5.249),
      autoRotate: false,
    },
    room11: {
      name: 'Bara Technicka chodba',
      position: new THREE.Vector3(-2.161, -0.900, 1.593),
      target:   new THREE.Vector3(-2.009, -1.313, 0.695),
      autoRotate: false,
    },
    room12: {
      name: 'Bara Uloziste',
      position: new THREE.Vector3(-2.728, -1.106, -0.261),
      target:   new THREE.Vector3(-3.267, -1.541, 0.460),
      autoRotate: false,
    },
    room13: {
      name: 'Bara Technicka mistnost',
      position: new THREE.Vector3(-0.362, -1.207, -0.212),
      target:   new THREE.Vector3(0.065, -1.451, 0.658),
      autoRotate: false,
    },
    room9: {
      name: 'Bara Loznice',
      position: new THREE.Vector3(-0.172, -1.713, 3.118),
      target:   new THREE.Vector3(0.518, -1.901, 3.817),
      autoRotate: false,
    },
    room10: {
      name: 'Bara Koupelna 2',
      position: new THREE.Vector3(1.801, -1.539, 2.075),
      target:   new THREE.Vector3(2.322, -1.889, 1.297),
      autoRotate: false,
    },
    room5: {
      name: 'Bara Schodiste',
      position: new THREE.Vector3(-3.219, 0.412, 2.281),
      target:   new THREE.Vector3(-2.605, 0.221, 3.046),
      autoRotate: false,
    },
    room1: {
      name: 'Bara Detsky pokoj 1',
      position: new THREE.Vector3(2.903, 0.392, 4.373),
      target:   new THREE.Vector3(2.689, 0.175, 5.325),
      autoRotate: false,
    },
    room2: {
      name: 'Bara Detsky pokoj 2',
      position: new THREE.Vector3(0.222, 0.456, 4.630),
      target:   new THREE.Vector3(0.243, 0.428, 5.630),
      autoRotate: false,
    },
    room3: {
      name: 'Bara Obyvak',
      position: new THREE.Vector3(2.030, 1.056, 0.591),
      target:   new THREE.Vector3(1.101, 0.902, 0.928),
      autoRotate: false,
    },
    room4: {
      name: 'Bara Koupelna',
      position: new THREE.Vector3(-2.102, 1.661, 6.174),
      target:   new THREE.Vector3(-1.726, 1.136, 6.937),
      autoRotate: false,
    },
    room6: {
      name: 'Bara Zachod',
      position: new THREE.Vector3(-3.493, 1.374, 6.198),
      target:   new THREE.Vector3(-3.099, 0.826, 6.935),
      autoRotate: false,
    },
    room14: {
      name: 'Risa Vchod',
      position: new THREE.Vector3(6.301, 3.775, 3.643),
      target:   new THREE.Vector3(5.834, 3.356, 2.863),
      autoRotate: false,
    },
    room15: {
      name: 'Risa Obyvak',
      position: new THREE.Vector3(2.923, 4.301, 2.081),
      target:   new THREE.Vector3(2.186, 3.779, 1.652),
      autoRotate: false,
    },
    room16: {
      name: 'Risa Kuchyn',
      position: new THREE.Vector3(-1.579, 4.015, 2.500),
      target:   new THREE.Vector3(-2.249, 3.733, 1.813),
      autoRotate: false,
    },
    room17: {
      name: 'Risa Uloziste na bordel',
      position: new THREE.Vector3(-1.357, 3.910, 3.401),
      target:   new THREE.Vector3(-2.214, 3.660, 3.850),
      autoRotate: false,
    },
    room18: {
      name: 'Risa Koupelna',
      position: new THREE.Vector3(-1.563, 3.635, 5.655),
      target:   new THREE.Vector3(-2.220, 3.414, 6.376),
      autoRotate: false,
    },
    room19: {
      name: 'Risa Loznice',
      position: new THREE.Vector3(-0.096, 3.827, 3.604),
      target:   new THREE.Vector3(0.605, 3.576, 4.273),
      autoRotate: false,
    },
    room20: {
      name: 'Risa Kurarna',
      position: new THREE.Vector3(-0.165, 3.788, 8.148),
      target:   new THREE.Vector3(0.746, 3.413, 7.977),
      autoRotate: false,
    },
  };
  // ────────────────────────────────────────────────────────────────────────────

  // ─── RENDERER ───────────────────────────────────────────────────────────────
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a2e);

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.copy(VIEWS.global.position);

  // ─── ORBIT — used only for global auto-rotate view ──────────────────────────
  const orbit = new OrbitControls(camera, renderer.domElement);
  orbit.enableDamping = true;
  orbit.dampingFactor = 0.05;
  orbit.target.copy(VIEWS.global.target);
  orbit.autoRotate = true;
  orbit.autoRotateSpeed = 0.6;
  orbit.enabled = true;
  orbit.update();

  // ─── FPS STATE ──────────────────────────────────────────────────────────────
  let fpsMode   = false; // true when in a room view (not global)
  let mouseDown = false;
  let pitch = 0, yaw = 0;
  const keys  = { w: false, a: false, s: false, d: false };
  const SPEED = 4;

  const coordsEl  = document.getElementById('coords');
  const copyBtn   = document.getElementById('coords-copy');

  let lastPos = new THREE.Vector3();
  let lastTarget = new THREE.Vector3();

  copyBtn.addEventListener('click', () => {
    const p = lastPos, t = lastTarget;
    const text =
`    roomX: {
      name: 'CHANGE',
      position: new THREE.Vector3(${p.x.toFixed(3)}, ${p.y.toFixed(3)}, ${p.z.toFixed(3)}),
      target:   new THREE.Vector3(${t.x.toFixed(3)}, ${t.y.toFixed(3)}, ${t.z.toFixed(3)}),
      autoRotate: false,
    },`;
    navigator.clipboard.writeText(text).then(() => {
      copyBtn.textContent = 'Copied!';
      setTimeout(() => { copyBtn.textContent = 'Copy to clipboard'; }, 1500);
    });
  });

  const dpad = document.getElementById('dpad');

  function enterFPS() {
    fpsMode = true;
    orbit.enabled = false;
    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    yaw   = Math.atan2(-dir.x, -dir.z);
    pitch = Math.asin(Math.max(-1, Math.min(1, dir.y)));
    camera.rotation.order = 'YXZ';
    camera.rotation.set(pitch, yaw, 0);
    lastPos.copy(camera.position);
    lastTarget.set(camera.position.x + dir.x, camera.position.y + dir.y, camera.position.z + dir.z);
    coordsEl.style.display = 'block';
    dpad.classList.add('visible');
  }

  function exitFPS() {
    fpsMode = false;
    orbit.enabled = true;
    coordsEl.style.display = 'none';
    dpad.classList.remove('visible');
    keys.w = keys.a = keys.s = keys.d = false;
  }

  // Mouse look — only while button held
  renderer.domElement.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    mouseDown = true;
    renderer.domElement.classList.add('dragging');
  });
  window.addEventListener('mouseup', e => {
    if (e.button !== 0) return;
    mouseDown = false;
    renderer.domElement.classList.remove('dragging');
  });

  window.addEventListener('mousemove', e => {
    if (!fpsMode || !mouseDown) return;
    yaw   -= e.movementX * 0.003;
    pitch -= e.movementY * 0.003;
    pitch  = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, pitch));
    camera.rotation.set(pitch, yaw, 0);
  });

  // Touch look — single finger drag on canvas
  let touchLook = null;
  renderer.domElement.addEventListener('touchstart', e => {
    if (!fpsMode) return;
    // only track touches that didn't start on the dpad
    const t = e.changedTouches[0];
    if (document.elementFromPoint(t.clientX, t.clientY).closest('#dpad')) return;
    e.preventDefault();
    touchLook = { id: t.identifier, x: t.clientX, y: t.clientY };
  }, { passive: false });

  renderer.domElement.addEventListener('touchmove', e => {
    if (!fpsMode || !touchLook) return;
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier !== touchLook.id) continue;
      const dx = t.clientX - touchLook.x;
      const dy = t.clientY - touchLook.y;
      yaw   -= dx * 0.005;
      pitch -= dy * 0.005;
      pitch  = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, pitch));
      camera.rotation.set(pitch, yaw, 0);
      touchLook.x = t.clientX;
      touchLook.y = t.clientY;
    }
  }, { passive: false });

  renderer.domElement.addEventListener('touchend', e => {
    if (!touchLook) return;
    for (const t of e.changedTouches) {
      if (t.identifier === touchLook.id) touchLook = null;
    }
  });

  // WASD — only in FPS mode
  window.addEventListener('keydown', e => {
    if (!fpsMode) return;
    if (e.code === 'KeyW') keys.w = true;
    if (e.code === 'KeyA') keys.a = true;
    if (e.code === 'KeyS') keys.s = true;
    if (e.code === 'KeyD') keys.d = true;
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'KeyW') keys.w = false;
    if (e.code === 'KeyA') keys.a = false;
    if (e.code === 'KeyS') keys.s = false;
    if (e.code === 'KeyD') keys.d = false;
  });

  // ─── LIGHTS ─────────────────────────────────────────────────────────────────
  scene.add(new THREE.AmbientLight(0xc8d8ff, 0.4));

  const sun = new THREE.DirectionalLight(0xfff4e0, 4);
  sun.position.set(15, 25, 10);
  sun.castShadow = true;
  sun.shadow.mapSize.width  = 2048;
  sun.shadow.mapSize.height = 2048;
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far  = 80;
  sun.shadow.camera.left   = -20;
  sun.shadow.camera.right  =  20;
  sun.shadow.camera.top    =  20;
  sun.shadow.camera.bottom = -20;
  sun.shadow.bias = -0.001;
  scene.add(sun);

  // cool sky fill from the opposite side — simulates bounce light from sky
  const fill = new THREE.DirectionalLight(0x7ab0ff, 0.6);
  fill.position.set(-10, 8, -10);
  scene.add(fill);

  // warm ground bounce
  const bounce = new THREE.HemisphereLight(0x8ab0ff, 0x7a5f3a, 0.5);
  scene.add(bounce);

  // ─── MODEL ──────────────────────────────────────────────────────────────────
  new GLTFLoader().load('vinary4.glb', (gltf) => {
    const model = gltf.scene;
    model.traverse(n => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; } });
    const box    = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    model.position.sub(center);
    scene.add(model);
    camera.position.copy(VIEWS.global.position);
    orbit.update();
  });

  // ─── UI — list items generated from VIEWS ───────────────────────────────────
  const listEl = document.getElementById('view-list');
  let activeLi = null;

  function setActive(li) {
    if (activeLi) activeLi.classList.remove('active');
    activeLi = li;
    if (li) li.classList.add('active');
  }

  Object.entries(VIEWS).forEach(([key, view]) => {
    const li = document.createElement('li');
    const a  = document.createElement('a');
    a.textContent = view.name;
    a.addEventListener('click', () => {
      setActive(li);
      goToView(key);
      setRoomName(key);
      toggleOverlay(false);
    });
    li.appendChild(a);
    listEl.appendChild(li);
    if (key === 'global') setActive(li);
  });

  // ─── CAMERA ANIMATION ───────────────────────────────────────────────────────
  const anim = {
    active: false,
    fromPos: new THREE.Vector3(), fromTarget: new THREE.Vector3(),
    toPos:   new THREE.Vector3(), toTarget:   new THREE.Vector3(),
    t: 0, duration: 1.2, toAutoRotate: false,
  };

  function goToView(key) {
    const view = VIEWS[key];
    anim.fromPos.copy(camera.position);
    // fromTarget: current look-at point
    if (fpsMode) {
      const dir = new THREE.Vector3();
      camera.getWorldDirection(dir);
      anim.fromTarget.copy(camera.position).addScaledVector(dir, 1);
    } else {
      anim.fromTarget.copy(orbit.target);
    }
    anim.toPos.copy(view.position);
    anim.toTarget.copy(view.target);
    anim.t = 0;
    anim.active = true;
    anim.toAutoRotate = view.autoRotate;
    // Disable both during animation
    orbit.enabled = false;
    fpsMode = false;
    coordsEl.style.display = 'none';
  }

  const easeInOut = t => t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t;

  // ─── RENDER LOOP ─────────────────────────────────────────────────────────────
  const clock = new THREE.Clock();
  const fwd   = new THREE.Vector3();
  const right = new THREE.Vector3();
  const move  = new THREE.Vector3();

  function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();

    if (anim.active) {
      anim.t = Math.min(anim.t + delta / anim.duration, 1);
      const e = easeInOut(anim.t);
      camera.position.lerpVectors(anim.fromPos, anim.toPos, e);
      // Point camera at interpolated target
      const lookAt = new THREE.Vector3().lerpVectors(anim.fromTarget, anim.toTarget, e);
      camera.lookAt(lookAt);

      if (anim.t >= 1) {
        anim.active = false;
        if (anim.toAutoRotate) {
          orbit.target.copy(anim.toTarget);
          orbit.update();
          exitFPS(); // enables orbit
        } else {
          enterFPS();
        }
      }
    } else if (fpsMode) {
      // WASD movement
      camera.getWorldDirection(fwd);
      right.crossVectors(fwd, camera.up).normalize();
      move.set(0, 0, 0);
      if (keys.w) move.addScaledVector(fwd,   SPEED * delta);
      if (keys.s) move.addScaledVector(fwd,  -SPEED * delta);
      if (keys.d) move.addScaledVector(right,  SPEED * delta);
      if (keys.a) move.addScaledVector(right, -SPEED * delta);
      camera.position.add(move);

      // Update coords overlay
      const p = camera.position;
      camera.getWorldDirection(fwd);
      lastPos.copy(p);
      lastTarget.set(p.x + fwd.x, p.y + fwd.y, p.z + fwd.z);
      document.getElementById('coords-text').innerHTML =
        `<b>position</b><br>` +
        `x: ${p.x.toFixed(3)}<br>` +
        `y: ${p.y.toFixed(3)}<br>` +
        `z: ${p.z.toFixed(3)}<br><br>` +
        `<b>target (pos+dir)</b><br>` +
        `x: ${lastTarget.x.toFixed(3)}<br>` +
        `y: ${lastTarget.y.toFixed(3)}<br>` +
        `z: ${lastTarget.z.toFixed(3)}<br>`;
    } else {
      orbit.update();
    }

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ─── D-PAD touch ────────────────────────────────────────────────────────────
  const dpTouches = {}; // touchId → key

  dpad.addEventListener('touchstart', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      const el = document.elementFromPoint(t.clientX, t.clientY);
      const k = el?.dataset?.key;
      if (!k) continue;
      dpTouches[t.identifier] = k;
      keys[k] = true;
      el.classList.add('pressed');
    }
  }, { passive: false });

  dpad.addEventListener('touchend', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      const k = dpTouches[t.identifier];
      if (!k) continue;
      keys[k] = false;
      delete dpTouches[t.identifier];
      dpad.querySelector(`[data-key="${k}"]`)?.classList.remove('pressed');
    }
  }, { passive: false });

  dpad.addEventListener('touchcancel', e => {
    for (const t of e.changedTouches) {
      const k = dpTouches[t.identifier];
      if (k) { keys[k] = false; delete dpTouches[t.identifier]; }
    }
    dpad.querySelectorAll('.dp').forEach(el => el.classList.remove('pressed'));
  });

  // ─── OVERLAY ─────────────────────────────────────────────────────────────────
  const menuBtn = document.getElementById('menu-btn');
  const overlay = document.getElementById('overlay');

  const roomNameEl = document.getElementById('room-name');

  function setRoomName(key) {
    roomNameEl.textContent = VIEWS[key].name;
  }

  function toggleOverlay(open) {
    menuBtn.classList.toggle('open', open);
    overlay.classList.toggle('open', open);
  }

  menuBtn.addEventListener('click', () => toggleOverlay(!overlay.classList.contains('open')));
  overlay.addEventListener('click', e => { if (e.target === overlay) toggleOverlay(false); });

  // ─── ROOM NAV ARROWS ─────────────────────────────────────────────────────────
  const viewKeys = Object.keys(VIEWS);
  let currentViewIndex = 0;

  function navigateRoom(delta) {
    currentViewIndex = (currentViewIndex + delta + viewKeys.length) % viewKeys.length;
    const key = viewKeys[currentViewIndex];
    const li = listEl.children[currentViewIndex];
    setActive(li);
    goToView(key);
    setRoomName(key);
  }

  document.getElementById('room-prev').addEventListener('click', () => navigateRoom(-1));
  document.getElementById('room-next').addEventListener('click', () => navigateRoom(1));

  // Keep currentViewIndex in sync when clicking list items
  listEl.addEventListener('click', e => {
    const li = e.target.closest('li');
    if (!li) return;
    currentViewIndex = Array.from(listEl.children).indexOf(li);
  });
</script>
</body>
</html>

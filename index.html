<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>House</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; overflow: hidden; font-family: system-ui, sans-serif; }
    canvas { display: block; }

    #ui {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 10;
      flex-wrap: wrap;
      justify-content: center;
    }

    #ui button {
      padding: 10px 18px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      background: rgba(10, 10, 30, 0.75);
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background 0.2s, border-color 0.2s;
      white-space: nowrap;
    }
    #ui button:hover { background: rgba(60,100,200,0.5); border-color: rgba(100,160,255,0.6); }
    #ui button.active { background: rgba(60,100,200,0.8); border-color: rgba(100,160,255,0.9); }
    #ui button.free { border-color: rgba(255,160,80,0.5); }
    #ui button.free.active { background: rgba(180,80,20,0.8); border-color: rgba(255,160,80,0.9); }

    #coords {
      display: none;
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(0,0,0,0.6);
      color: #0f0;
      font-family: monospace;
      font-size: 13px;
      padding: 12px 16px;
      border-radius: 8px;
      backdrop-filter: blur(6px);
      line-height: 1.8;
      z-index: 10;
      pointer-events: none;
    }

    #crosshair {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 20px; height: 20px;
      pointer-events: none;
      z-index: 10;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.8);
    }
    #crosshair::before { width: 2px; height: 100%; left: 50%; transform: translateX(-50%); }
    #crosshair::after  { height: 2px; width: 100%; top: 50%; transform: translateY(-50%); }

    #lock-hint {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255,255,255,0.7);
      font-size: 15px;
      text-align: center;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

<div id="ui"></div>
<div id="coords"></div>
<div id="crosshair"></div>
<div id="lock-hint">Click to capture mouse<br><small>ESC to release · WASD to move</small></div>

<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
</script>
<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  // ─── VIEWS ──────────────────────────────────────────────────────────────────
  // Add/rename/reorder freely — buttons are generated from this object.
  // position: where the camera sits
  // target:   where the camera looks
  // autoRotate: spin around on global view
  const VIEWS = {
    global: {
      name: 'Global View',
      position: new THREE.Vector3(10, 5, 10),
      target:   new THREE.Vector3(0, 0, 0),
      autoRotate: true,
    },
    room1: {
      name: 'Detsky pokoj 1',
      position: new THREE.Vector3(2.903, 0.392, 4.373),
      target:   new THREE.Vector3(2.689, 0.175, 5.325),
      autoRotate: false,
    },
    room2: {
      name: 'Detsky pokoj 2',
      position: new THREE.Vector3(0.222, 0.456, 4.630),
      target:   new THREE.Vector3(0.243, 0.428, 5.630),
      autoRotate: false,
    },
    room3: {
      name: 'Obyvak',
      position: new THREE.Vector3(2.030, 1.056, 0.591),
      target:   new THREE.Vector3(1.101, 0.902, 0.928),
      autoRotate: false,
    },
  };
  // ────────────────────────────────────────────────────────────────────────────

  // ─── RENDERER ───────────────────────────────────────────────────────────────
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a2e);

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.copy(VIEWS.global.position);

  // ─── ORBIT CONTROLS (normal mode) ──────────────────────────────────────────
  const orbit = new OrbitControls(camera, renderer.domElement);
  orbit.enableDamping = true;
  orbit.dampingFactor = 0.05;
  orbit.target.copy(VIEWS.global.target);
  orbit.autoRotate = true;
  orbit.autoRotateSpeed = 0.6;
  orbit.update();

  // ─── FREE MODE — raw pointer lock + manual FPS movement ────────────────────
  const keys = { w: false, a: false, s: false, d: false };
  const SPEED = 8; // units per second
  let freePitch = 0, freeYaw = 0; // current euler angles in free mode

  document.addEventListener('keydown', e => {
    if (!freeMode) return;
    if (e.code === 'KeyW') keys.w = true;
    if (e.code === 'KeyA') keys.a = true;
    if (e.code === 'KeyS') keys.s = true;
    if (e.code === 'KeyD') keys.d = true;
  });
  document.addEventListener('keyup', e => {
    if (e.code === 'KeyW') keys.w = false;
    if (e.code === 'KeyA') keys.a = false;
    if (e.code === 'KeyS') keys.s = false;
    if (e.code === 'KeyD') keys.d = false;
  });

  document.addEventListener('mousemove', e => {
    if (!freeMode || document.pointerLockElement !== renderer.domElement) return;
    freeYaw   -= e.movementX * 0.002;
    freePitch -= e.movementY * 0.002;
    freePitch  = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, freePitch));
    camera.rotation.order = 'YXZ';
    camera.rotation.y = freeYaw;
    camera.rotation.x = freePitch;
  });

  document.addEventListener('pointerlockchange', () => {
    if (!freeMode) return;
    lockHint.style.display = document.pointerLockElement === renderer.domElement ? 'none' : 'block';
  });

  // ─── LIGHTS ─────────────────────────────────────────────────────────────────
  scene.add(new THREE.AmbientLight(0xffffff, 1.5));
  const sun = new THREE.DirectionalLight(0xffffff, 3);
  sun.position.set(10, 20, 10);
  sun.castShadow = true;
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0xaaccff, 1);
  fill.position.set(-10, 5, -10);
  scene.add(fill);

  // ─── MODEL ──────────────────────────────────────────────────────────────────
  new GLTFLoader().load('vinary4.glb', (gltf) => {
    const model = gltf.scene;
    model.traverse(n => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; } });

    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const maxDim = Math.max(...box.getSize(new THREE.Vector3()).toArray());

    model.position.sub(center);
    scene.add(model);

    camera.position.copy(VIEWS.global.position);
    orbit.update();
  });

  // ─── UI — generate buttons from VIEWS ───────────────────────────────────────
  const uiEl       = document.getElementById('ui');
  const coordsEl   = document.getElementById('coords');
  const crosshair  = document.getElementById('crosshair');
  const lockHint   = document.getElementById('lock-hint');

  let activeBtn = null;
  let freeMode  = false;

  function setActive(btn) {
    if (activeBtn) activeBtn.classList.remove('active');
    activeBtn = btn;
    if (btn) btn.classList.add('active');
  }

  // View buttons
  Object.entries(VIEWS).forEach(([key, view]) => {
    const btn = document.createElement('button');
    btn.textContent = view.name;
    btn.addEventListener('click', () => {
      if (freeMode) exitFreeMode();
      setActive(btn);
      goToView(key);
    });
    uiEl.appendChild(btn);
    if (key === 'global') setActive(btn);
  });

  // Free mode button
  const freeBtn = document.createElement('button');
  freeBtn.textContent = 'Free Mode';
  freeBtn.classList.add('free');
  freeBtn.addEventListener('click', () => {
    if (freeMode) { exitFreeMode(); } else { enterFreeMode(); }
  });
  uiEl.appendChild(freeBtn);

  function enterFreeMode() {
    freeMode = true;
    freeBtn.classList.add('active');
    setActive(null);
    orbit.enabled = false;
    coordsEl.style.display = 'block';
    crosshair.style.display = 'block';
    lockHint.style.display  = 'block';
    // Derive yaw/pitch from the actual look direction — avoids Euler order issues
    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    freeYaw   = Math.atan2(-dir.x, -dir.z);
    freePitch = Math.asin(Math.max(-1, Math.min(1, dir.y)));
    camera.rotation.order = 'YXZ';
    camera.rotation.set(freePitch, freeYaw, 0);
    renderer.domElement.addEventListener('click', requestLock);
  }

  function exitFreeMode() {
    freeMode = false;
    freeBtn.classList.remove('active');
    if (document.pointerLockElement === renderer.domElement) document.exitPointerLock();
    orbit.enabled = true;
    coordsEl.style.display  = 'none';
    crosshair.style.display = 'none';
    lockHint.style.display  = 'none';
    renderer.domElement.removeEventListener('click', requestLock);
  }

  function requestLock() { renderer.domElement.requestPointerLock(); }

  // ─── CAMERA ANIMATION ───────────────────────────────────────────────────────
  const anim = {
    active: false,
    fromPos: new THREE.Vector3(), fromTarget: new THREE.Vector3(),
    toPos:   new THREE.Vector3(), toTarget:   new THREE.Vector3(),
    t: 0, duration: 1.2, afterRotate: false,
  };

  function goToView(key) {
    const view = VIEWS[key];
    anim.fromPos.copy(camera.position);
    anim.fromTarget.copy(orbit.target);
    anim.toPos.copy(view.position);
    anim.toTarget.copy(view.target);
    anim.t = 0;
    anim.active = true;
    anim.afterRotate = view.autoRotate;
    orbit.autoRotate = false;
    orbit.enabled = false;
  }

  const easeInOut = t => t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t;

  // ─── RENDER LOOP ─────────────────────────────────────────────────────────────
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();

    if (freeMode) {
      // WASD movement along the actual camera look direction (including pitch)
      const forward = new THREE.Vector3();
      camera.getWorldDirection(forward);
      const right = new THREE.Vector3();
      right.crossVectors(forward, camera.up).normalize();
      const move    = new THREE.Vector3();
      if (keys.w) move.addScaledVector(forward,  SPEED * delta);
      if (keys.s) move.addScaledVector(forward, -SPEED * delta);
      if (keys.d) move.addScaledVector(right,    SPEED * delta);
      if (keys.a) move.addScaledVector(right,   -SPEED * delta);
      camera.position.add(move);

      // Coords overlay — always visible in free mode
      const p = camera.position;
      const dir = new THREE.Vector3();
      camera.getWorldDirection(dir);
      coordsEl.innerHTML =
        `<b>position</b><br>` +
        `x: ${p.x.toFixed(3)}<br>` +
        `y: ${p.y.toFixed(3)}<br>` +
        `z: ${p.z.toFixed(3)}<br><br>` +
        `<b>target (pos + dir)</b><br>` +
        `x: ${(p.x + dir.x).toFixed(3)}<br>` +
        `y: ${(p.y + dir.y).toFixed(3)}<br>` +
        `z: ${(p.z + dir.z).toFixed(3)}`;
    }

    if (anim.active) {
      anim.t = Math.min(anim.t + delta / anim.duration, 1);
      const e = easeInOut(anim.t);
      camera.position.lerpVectors(anim.fromPos, anim.toPos, e);
      orbit.target.lerpVectors(anim.fromTarget, anim.toTarget, e);
      if (anim.t >= 1) {
        anim.active = false;
        orbit.autoRotate = anim.afterRotate;
        orbit.enabled = true;
      }
    }

    if (!freeMode) orbit.update();
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
